<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>MHP | Supervisor Terminal</title>
    <style>
        #supervisorContent { display: none; }
        
        .terminal-grid {
            display: grid;
            grid-template-columns: 250px 1fr 250px;
            gap: 20px;
            margin-top: 20px;
        }

        .side-panel {
            background: #e9ecef;
            padding: 15px;
            border-radius: 5px;
            font-size: 12px;
            border-top: 4px solid var(--mhp-blue);
            max-height: 80vh;
            overflow-y: auto;
        }

        .log-entry {
            padding: 8px;
            border-bottom: 1px solid #ccc;
            margin-bottom: 5px;
        }

        .delete-notice { color: var(--police-red); font-weight: bold; }
        .login-notice { color: var(--mhp-blue); font-weight: bold; }
    </style>
</head>
<body>
    <nav>
        <div class="nav-left">
            <a href="index.html"><img src="Logo.png" alt="MHP Logo" class="nav-logo"></a>
        </div>
        <div class="nav-links">
            <a href="index.html">Announcements</a>
            <a href="database.html">Database</a>
            <a href="coc.html">Chain of Command</a>
            <a href="feedback.html">Feedback</a>
            <a href="supervisors.html" style="color: var(--mhp-gold);">Supervisors Only</a>
        </div>
        <div class="nav-right">HIGH COMMAND ACCESS</div>
    </nav>

    <div id="loginGate" class="container" style="text-align: center; margin-top: 50px;">
        <h1>🔐 Supervisor Authentication</h1>
        <div class="mhp-card" style="border-left-color: var(--mhp-gold);">
            <div style="display: grid; gap: 10px; max-width: 300px; margin: 0 auto;">
                <input type="text" id="supCallsign" placeholder="Your Callsign (e.g. 1-A-01)">
                <input type="text" id="supUser" placeholder="Your Username">
                <input type="password" id="accessCode" placeholder="Clearance Code">
            </div>
            <br>
            <button id="authBtn" onclick="verifySupervisor()" class="btn-mhp">INITIALIZE SECURE SESSION</button>
        </div>
    </div>

    <div id="supervisorContent" class="container" style="max-width: 1200px;">
        <div class="terminal-grid">
            
            <div class="side-panel">
                <h4 style="margin-top:0;">🛡️ AUDIT LOGS</h4>
                <div id="auditDisplay"></div>
            </div>

            <div>
                <h1 style="margin-top:0;">Command Terminal</h1>
                <div style="text-align: right; margin-bottom: 15px;">
                    <button onclick="wipeLogs()" class="btn-mhp" style="background: var(--police-red); font-size: 12px;">WIPE FEEDBACK LOGS</button>
                </div>
                <div id="logDisplay"></div>
            </div>

            <div class="side-panel">
                <h4 style="margin-top:0;">🔑 ACCESS LOGS</h4>
                <div id="accessDisplay"></div>
            </div>

        </div>
    </div>

    <script>
        let currentSupervisor = "";

        function verifySupervisor() {
            const callsign = document.getElementById('supCallsign').value;
            const user = document.getElementById('supUser').value;
            const code = document.getElementById('accessCode').value;
            const btn = document.getElementById('authBtn');

            if (code === "385638" && callsign && user) {
                currentSupervisor = `${callsign} (${user})`;
                
                // Track the Login
                saveSystemLog('access', `Login: ${currentSupervisor}`);
                
                document.getElementById('loginGate').style.display = "none";
                document.getElementById('supervisorContent').style.display = "block";
                refreshTerminal();
            } else {
                alert("ACCESS DENIED: Credentials Invalid.");
                btn.disabled = true;
                btn.style.background = "#444";
            }
        }

        function refreshTerminal() {
            displayFeedback();
            displaySystemLogs();
        }

        function displayFeedback() {
            const container = document.getElementById('logDisplay');
            const logs = JSON.parse(localStorage.getItem('mhpFeedback')) || [];
            container.innerHTML = logs.length === 0 ? "<p>No reports on file.</p>" : "";
            logs.reverse().forEach(log => {
                const div = document.createElement('div');
                div.className = 'mhp-card';
                div.innerHTML = `<small>${log.callsign}</small><br><b>${log.reason}</b>`;
                container.appendChild(div);
            });
        }

        function saveSystemLog(type, message) {
            let sysLogs = JSON.parse(localStorage.getItem('mhpSystemLogs')) || [];
            const timestamp = new Date().toLocaleString();
            sysLogs.push({ type, message, time: timestamp });
            localStorage.setItem('mhpSystemLogs', JSON.stringify(sysLogs));
        }

        function displaySystemLogs() {
            const auditDiv = document.getElementById('auditDisplay');
            const accessDiv = document.getElementById('accessDisplay');
            const sysLogs = JSON.parse(localStorage.getItem('mhpSystemLogs')) || [];

            auditDiv.innerHTML = "";
            accessDiv.innerHTML = "";

            sysLogs.reverse().forEach(log => {
                const entry = `<div class="log-entry"><small>${log.time}</small><br>${log.message}</div>`;
                if (log.type === 'audit') auditDiv.innerHTML += entry;
                if (log.type === 'access') accessDiv.innerHTML += entry;
            });
        }

        function wipeLogs() {
            if (confirm("Permanently delete feedback?")) {
                saveSystemLog('audit', `DELETED BY: ${currentSupervisor}`);
                localStorage.removeItem('mhpFeedback');
                refreshTerminal();
            }
        }
    </script>
</body>
</html>
